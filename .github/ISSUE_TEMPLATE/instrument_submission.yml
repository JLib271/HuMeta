name: Recommend an instrument
description: Suggest a research instrument for the HuMeta Library. Only the first three questions are required.
title: "Recommend: "
labels: [recommend instrument]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the library grow. **Only the first three questions are required.** We recommend depositing the instrument on STEMEd+ Commons first (see below). Fill in what you know and a maintainer will do the rest.
        An instrument does not need a theory behind it, or a complete set of validity and reliability evidence, to be included. The library shows each instrument's evidence so researchers can judge it for themselves.
        **Do not paste item text** unless the instrument's license allows it. Submissions are public.
  - type: input
    id: name
    attributes:
      label: "Instrument name (and acronym)"
      placeholder: "e.g. Geoscience Concept Inventory (GCI)"
    validations:
      required: true
  - type: textarea
    id: citation
    attributes:
      label: "Where it was published"
      description: "The main citation, with a DOI or link if you have one."
    validations:
      required: true
  - type: textarea
    id: measures
    attributes:
      label: "What it measures"
      description: "One line for the whole instrument, or one line per subscale. Use your own words; a maintainer matches them to the library's constructs."
      placeholder: "Whole instrument: understanding of plate tectonics\nor\nSelf-efficacy subscale (8 items): confidence in learning the course material"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### STEMEd+ Commons deposit (recommended)
        Before you submit, make **one deposit** in the [HuMeta Instrument Library collection on Knowledge Commons](https://works.hcommons.org/collections/humetainstrumentlibrary/) holding everything as separate files: the instrument, its manual, item or scoring files, and a paper if you may share it ([how to deposit](https://jlib271.github.io/HuMeta/recommend/#deposit)). Its Library page will link to the deposit.
  - type: input
    id: commons_link
    attributes:
      label: "Link to the deposit on Knowledge Commons (KCWorks)"
      description: "We read the license, DOI, and collection from the deposit automatically and post them on this issue."
      placeholder: "https://works.hcommons.org/records/... or https://doi.org/10.17613/..."
  - type: checkboxes
    id: commons_contents
    attributes:
      label: "What's in the deposit?"
      description: "Please put everything in one record, as separate files."
      options:
        - label: "The instrument (questionnaire, test, protocol, or rubric)"
        - label: "Manual or user guide"
        - label: "Item, image, or scoring files"
        - label: "A paper about it"
  - type: checkboxes
    id: rights_holder
    attributes:
      label: "Rights"
      options:
        - label: "I hold the rights to what I deposited (for example, I am the instrument's developer), so the license applies to it"
  - type: markdown
    attributes:
      value: |
        ### About the instrument (optional)
  - type: dropdown
    id: type
    attributes:
      label: "Kind of instrument"
      options:
        - "Concept inventory or knowledge test"
        - "Attitude or beliefs survey"
        - "Self-report scale"
        - "Observation protocol"
        - "Interview protocol"
        - "Rubric"
        - "Other"
  - type: input
    id: who
    attributes:
      label: "Who responds, and at what level"
      placeholder: "e.g. undergraduates in introductory biology; K-12 teachers"
  - type: input
    id: format
    attributes:
      label: "Number of items and response format"
      placeholder: "e.g. 25 multiple-choice items; 18 items on a 5-point agreement scale"
  - type: dropdown
    id: development
    attributes:
      label: "How was it developed?"
      description: "A theory is not required."
      options:
        - "From a definition of what to measure (no theory named)"
        - "From a theory or framework"
        - "For a practical or instructional need"
        - "Not sure"
  - type: input
    id: theory
    attributes:
      label: "Theory or framework it was built on, if any"
  - type: dropdown
    id: access
    attributes:
      label: "How can researchers get it?"
      options:
        - "Free download"
        - "Open license (e.g. Creative Commons)"
        - "Request from the developer"
        - "Restricted or needs permission"
        - "Commercial"
        - "Not sure"
  - type: input
    id: link
    attributes:
      label: "Link to the instrument, its manual, or its terms of use"
  - type: markdown
    attributes:
      value: |
        ### Evidence (optional)
        Tick what the developers or later studies did, using the library's reliability and validity rubric (by J. Libarkin). Leave anything you are not sure about blank: a maintainer checks the sources.
  - type: checkboxes
    id: rubric_item_reliability
    attributes:
      label: "I. Item reliability"
      description: "Measure of intercorrelation and internal consistency of items."
      options:
        - label: "A. Cronbach's alpha, Kuder-Richardson"
        - label: "B. Cronbach's alpha reported (guide: > 0.7)"
        - label: "C. Item-total correlation / inter-item correlation"
        - label: "D. Item separation reliability reported (guide: > 0.9)"
        - label: "E. Person separation reliability reported (guide: > 0.7)"
  - type: checkboxes
    id: rubric_forms_reliability
    attributes:
      label: "II. Forms reliability"
      description: "Measure of replicability of responses on form(s) over time."
      options:
        - label: "A. Alternate forms"
        - label: "B. Split-half"
        - label: "C. Test-retest"
  - type: checkboxes
    id: rubric_item_analysis
    attributes:
      label: "III. Item analysis"
      description: "The extent to which items are precise ability measures and cover the full ability range of a population."
      options:
        - label: "A. Item difficulty"
        - label: "B. Item discrimination"
        - label: "C. Removal of misfit items"
        - label: "D. Item fit"
        - label: "E. Removal of misfit items"
  - type: checkboxes
    id: rubric_pre_item_content
    attributes:
      label: "IV. Pre-item content validity"
      description: "Alignment of item content with discipline, expert, and student views of the domain."
      options:
        - label: "A. Literature review"
        - label: "B. Textbook, lab manual, or course syllabi review"
        - label: "C. Review of discipline standards"
        - label: "D. Existing items used"
        - label: "E. Delphi method"
        - label: "F. Expert interviews, focus groups, or surveys"
        - label: "G. Student interviews, focus groups, or surveys"
  - type: checkboxes
    id: rubric_post_item_content
    attributes:
      label: "V. Post-item content validity"
      description: "Analysis of items after development."
      options:
        - label: "A. Expert review of items"
        - label: "B. Revision of items"
  - type: checkboxes
    id: rubric_communication
    attributes:
      label: "VI. Communication validity"
      description: "The extent to which test-takers interpret the items in the same way as intended by the test developer(s) (Lopez, 1996)."
      options:
        - label: "A. Think-alouds with students during testing"
        - label: "B. Interviews or focus groups with students after testing"
        - label: "C. Open-ended reasoning prompts as part of the test"
        - label: "D. Revision of items"
  - type: checkboxes
    id: rubric_cultural
    attributes:
      label: "VII. Cultural validity"
      description: "The extent to which items perform equally across subgroups within the population."
      options:
        - label: "A. Readability in terms of reading level and language"
        - label: "B. Piloting with a representative sample"
        - label: "C. Between-group comparisons such as differential item functioning (DIF) analysis or unpaired t-test equivalents"
  - type: checkboxes
    id: rubric_scale_analysis
    attributes:
      label: "VIII. Scale analysis"
      description: "Evaluation of whether items measure one variable or several."
      options:
        - label: "A. Unidimensionality analysis (often factor analysis)"
        - label: "B. Factor loadings reported (guide: > .32 or similar)"
        - label: "C. Unidimensionality analysis"
        - label: "D. Wright map"
  - type: checkboxes
    id: rubric_criterion_construct
    attributes:
      label: "IX. Criterion and construct validity"
      description: "The extent to which a scale is associated with a separate and strong measure of the variable, and the extent to which a scale acts as expected with respect to other measures associated with the theoretical latent."
      options:
        - label: "A. Content experts achieve high scores on the test"
        - label: "B. Discriminant validity (group differences)"
        - label: "C. Scores correlate with other measures"
  - type: checkboxes
    id: rubric_mc_item_writing
    attributes:
      label: "X. Multiple-choice item writing validity"
      description: "The extent to which items are written in accordance with research-based best practices (Frey, Haladyna, and others). Only for multiple-choice instruments."
      options:
        - label: "A. Stems do not have blanks"
        - label: "B. Stems are complete sentences"
        - label: "C. No excess material included"
        - label: "D. No extra terms in parentheses"
        - label: "E. Type K questions avoided"
        - label: "F. Complex response option formats avoided"
        - label: "G. \"All of the above\" options avoided"
        - label: "H. \"None of the above\" options avoided"
        - label: "I. Response options are parallel; the right answer does not stick out"
        - label: "J. 3-5 response options"
  - type: checkboxes
    id: rubric_likert_item_writing
    attributes:
      label: "XI. Likert-type item writing validity"
      description: "The extent to which items are written in accordance with research-based best practices (DeVellis and others). Only for Likert-type instruments."
      options:
        - label: "A. Stems are one statement (no double-barreled items)"
        - label: "B. Options are aligned with the construct"
        - label: "C. Options are exhaustive"
        - label: "D. Options go beyond agree/disagree where that fits"
        - label: "E. Even or odd scale chosen deliberately"
  - type: textarea
    id: evidence
    attributes:
      label: "Where is this evidence reported? Any values?"
      description: "Citations for the evidence you ticked, and any statistics with their samples (e.g. alpha = .85, n = 412 undergraduates)."
  - type: markdown
    attributes:
      value: |
        ### About you
  - type: dropdown
    id: relationship
    attributes:
      label: "Your relationship to the instrument"
      options:
        - "I am a developer"
        - "I have used it"
        - "I know of it"
  - type: textarea
    id: notes
    attributes:
      label: "Anything else? (versions, translations, adaptations)"
  - type: checkboxes
    id: confirm
    attributes:
      label: "Before you submit"
      options:
        - label: "This recommendation contains no item text I lack permission to share and no confidential information."
          required: true
