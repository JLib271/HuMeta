name: Recommend a theory, conceptual model, or framework
description: Suggest a theory, lens, or framework for Module 2's framework list
labels: [library, framework]
body:
  - type: markdown
    attributes:
      value: |
        You can also recommend frameworks in the HuMeta Portal (Module 2 → **Recommend a theory or framework**), with no GitHub account needed. Check the current list in `library/frameworks.json` first.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind is it?
      options:
        - Theory (with concepts and expected relationships)
        - Conceptual model or framework
        - Theoretical lens or perspective
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe it in a sentence or two
    validations:
      required: true
  - type: textarea
    id: concepts
    attributes:
      label: 'Concepts (one per line; optionally "Concept: definition")'
  - type: textarea
    id: relationships
    attributes:
      label: 'Expected relationships (one per line, as "A -> B: relationship")'
  - type: input
    id: citation
    attributes:
      label: Key citation (with DOI if available)
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why should it be in the list?
