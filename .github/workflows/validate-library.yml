name: Validate instrument library

on:
  pull_request:
    paths:
      - "library/**"
      - "scripts/validate_library.py"
  push:
    branches: [main]
    paths:
      - "library/**"
      - "scripts/validate_library.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema[format]>=4.18"
      - run: python scripts/validate_library.py
