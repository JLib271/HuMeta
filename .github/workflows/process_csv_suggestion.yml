name: Universal System Suggestion PR Gateway

on:
  issues:
    types: [opened]

jobs:
  generate-system-pr:
    if: startsWith(github.event.issue.title, '[Schema Suggestion]') || startsWith(github.event.issue.title, '[Analytics Suggestion]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      
    steps:
      - name: Checkout Source Code Tree
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract Ingestion Metadata
        id: parse_issue
        run: |
          TITLE="${{ github.event.issue.title }}"
          echo "Processing structural suggestion ticket: $TITLE"
          
          # Classify target pathway based on token header prefix
          if [[ "$TITLE" == *"[Schema Suggestion]"* ]]; then
            echo "target_type=schema" >> $GITHUB_OUTPUT
            # Extract raw block from between markdown backticks
            sed -n '/```csv/,/```/p' << 'EOF' > payload_extracted.csv
            ${{ github.event.issue.body }}
            EOF
            sed -i '/```/d' payload_extracted.csv
          elif [[ "\$TITLE" == *"[Analytics Suggestion]"* ]]; then
            echo "target_type=analytics" >> \$GITHUB_OUTPUT
            # Extract raw text block suggestion details
            sed -n '/```text/,/```/p' << 'EOF' > payload_extracted.txt
            ${{ github.event.issue.body }}
            EOF
            sed -i '/```/d' payload_extracted.txt
          fi

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ROUTE A: Run code modification if the user proposed a new Theoretical Schema matrix
      - name: Process Schema Update Execution
        if: steps.parse_issue.outputs.target_type == 'schema'
        run: |
          pip install pandas
          # Extract specific framework label from issue body
          FRAMEWORK=\$(grep -m 1 "Framework Target Name:" << 'EOF' | sed 's/Framework Target Name: //' || echo "Custom Framework")
          \${{ github.event.issue.body }}
          EOF
          export FRAMEWORK_NAME="\$FRAMEWORK"
          export CSV_CONTENT=\$(cat payload_extracted.csv)
          python .github/scripts/parse_csv_suggestion.py

      # ROUTE B: Package analytical code suggestions cleanly for human inspection
      - name: Process Analytics Code Review Ingestion
        if: steps.parse_issue.outputs.target_type == 'analytics'
        run: |
          echo "Analytics pipeline enhancement requested. Appending proposal log notes to reviewer logs..."
          echo -e "\n\n# --- PROPOSED ANALYTICS AMENDMENT --- \n# Issue Reference: #\${{ github.event.issue.number }}\n" >> openscience.py
          cat payload_extracted.txt >> openscience.py

      # Open isolated PR Branch with You as the ultimate human reviewer
      - name: Create Global Pull Request for Developer Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          commit-message: "propose: system architecture amendment via issue #\${{ github.event.issue.number }}"
          committer: GitHub <noreply@github.com>
          author: github-actions[bot] <github-actions[bot]@://github.com>
          branch: system-proposal-ticket-\${{ github.event.issue.number }}
          title: "🔧 \({{ github.event.issue.title }} (Issue #\){{ github.event.issue.number }})"
          body: |
            🤖 **Universal System Data Processing Report:**
            This Pull Request was generated automatically from a user submission form on your application metadata dashboard.
            
            ### Actions Required by Admin (Human-in-the-Loop Checkpoint):
            1. Click on the **"Files changed"** tab above to review code amendments to `openscience.py`.
            2. Verify if the mathematical calculations, metadata nodes, or schemas meet core standards.
            3. Click **"Merge Pull Request"** to compile and deploy live to your public Streamlit engine.
          labels: |
            community-suggestion
            human-review-required

      - name: Close Processing Ticket with Success Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: \${{ github.event.issue.number }}
          body: |
            🤖 **System Ingestion Engine Status Update:**
            Thank you! Your proposed modifications have been processed and safely packaged into a pending Pull Request review branch. An administrator has been alerted to inspect your code contributions!
