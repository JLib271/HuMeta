name: Recommendation deposit check

# When someone recommends an instrument, read the KCWorks deposit they linked (license, DOI,
# collection) and comment on the issue. The issue text is passed only as an environment variable
# and is never run.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: recommendation-check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'recommend instrument')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the deposit and comment
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_recommendation.py
