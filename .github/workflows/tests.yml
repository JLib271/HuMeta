name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (pyflakes errors and syntax)
        run: ruff check --select F,E9 openscience.py oem tests scripts
      - name: Unit tests and app smoke test (opens every page)
        run: python -m pytest -v
      - name: Validate instrument library
        run: python scripts/validate_library.py
      - name: standard/humeta/ matches the pinned humeta-profile release
        run: python scripts/update_profile.py --check
      - name: HuMeta profile artifacts are up to date
        run: python scripts/build_profile_artifacts.py --check
