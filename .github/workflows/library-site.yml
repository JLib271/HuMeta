name: HuMeta pages (policies and old Library address)

# Publishes https://jlib271.github.io/HuMeta/: the HuMeta Portal's privacy policy (privacy/) and terms
# of service (terms/), from PRIVACY.md and TERMS.md, and forwarding for the HuMeta Library website's
# old address. The Library moved to https://jlib271.github.io/humeta-library/ (built in
# JLib271/humeta-library); every old page forwards to the same page there.

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "scripts/build_library_redirects.py"
      - "PRIVACY.md"
      - "TERMS.md"
      - "oem/vocab.py"
      - ".github/workflows/library-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: Build the policy and forwarding pages
        run: python scripts/build_library_redirects.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
